tag_prefix = "v"

# `cog bump` (run by scripts/release.sh) writes the new version into these
# files, then commits them together with CHANGELOG.md as the release commit.
pre_bump_hooks = [
  "sed --in-place --regexp-extended 's/^(\\s*version = )\"[^\"]*\";/\\1\"{{version}}\";/' flake.nix",
  "grep --quiet --fixed-strings 'version = \"{{version}}\";' flake.nix",
  "npm --prefix vscode version {{version}} --no-git-tag-version --allow-same-version",
]

[commit_types]
  [commit_types.feat]
  changelog_title = "Features"
  [commit_types.fix]
  changelog_title = "Bug Fixes"
  [commit_types.refactor]
  changelog_title = "Refactoring"
  [commit_types.test]
  changelog_title = "Tests"
  [commit_types.chore]
  changelog_title = "Chores"
  [commit_types.ci]
  changelog_title = "CI"
  [commit_types.cd]
  changelog_title = "CD"
  [commit_types.docs]
  changelog_title = "Documentation"

[changelog]
  path = "CHANGELOG.md"
  template = "remote"
  remote = "github.com"
  repository = "bpfls"
  owner = "anakin4747"
  authors = []
